# Every 10 minutes from 6 am to 2 am Eastern: predict tonight's games, lock picks at puck drop, publish.
name: Pregame
on:
  schedule:
    - cron: "*/10 10-23 * * *"
    - cron: "*/10 0-6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: blc-data
  cancel-in-progress: false
jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Predict, lock and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline.run pregame
      - name: Commit
        run: bash scripts/commit.sh "pregame $(date -u +%Y-%m-%dT%H:%MZ)"
