# On every code change: replay a fake opening night end to end (predict, lock, tamper check, grade, learn).
name: Tests
on:
  push:
    paths: ["pipeline/**", "tests/**", "requirements.txt"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tests.test_live_flow
