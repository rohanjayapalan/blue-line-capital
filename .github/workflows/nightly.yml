# Every morning: add last night's games, grade the tape, settle the books, learn, rebuild the snapshot.
# The second run is a backup; running twice changes nothing.
name: Nightly
on:
  schedule:
    - cron: "30 9 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: blc-data
  cancel-in-progress: false
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest, grade, learn, snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline.run nightly
      - name: Commit
        run: bash scripts/commit.sh "nightly $(date -u +%Y-%m-%d)"
